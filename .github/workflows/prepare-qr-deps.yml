name: Prepare QR dependencies

on:
  push:
    branches: [feature/create-service-qr]
    paths: [package.json]

permissions:
  contents: write

jobs:
  update-lockfile-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/create-service-qr
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Resolve dependency lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install and check TypeScript
        run: |
          npm ci --ignore-scripts
          npx tsc --noEmit
      - name: Commit updated lockfile on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --staged --quiet; then
            git commit -m "Lock Expo Camera and QR code dependencies"
            git push origin HEAD:feature/create-service-qr
          fi
