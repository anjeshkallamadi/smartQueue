name: SmartQueue database validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'docs/README_REVIEW.md'
      - '.github/workflows/database-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Initialize disposable local Supabase project
        run: supabase init
      - name: Apply migrations to fresh local Supabase database
        run: supabase start
      - name: Run database security and queue-operation tests
        run: supabase test db
      - name: Stop test services
        if: always()
        run: supabase stop --no-backup || true
